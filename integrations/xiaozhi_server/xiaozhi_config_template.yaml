server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://${HOST_IP}:8000/xiaozhi/v1/
  vision_explain: http://${HOST_IP}:8003/mcp/vision/explain
  auth:
    enabled: false

selected_module:
  LLM: ChatGLMLLM
  Memory: nomem
  Intent: nointent
  ASR: BuddyQwenASR

ASR:
  BuddyQwenASR:
    type: buddy_qwen
    provider_name: ${ASR_PROVIDER}
    api_key: ${ASR_API_KEY}
    model_name: ${ASR_MODEL}
    base_url: ${ASR_HTTP_URL}
    timeout_seconds: ${ASR_TIMEOUT_SECONDS}
