server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://${HOST_IP}:8000/xiaozhi/v1/
  vision_explain: http://${HOST_IP}:8003/mcp/vision/explain
  auth:
    enabled: false

buddy_mode: true
read_config_from_api: false
manager-api:
  url: ""
  secret: ""
mcp_endpoint: ""
end_prompt:
  enable: false
tools:
  enable: false
context_providers: []
voiceprint: false
report:
  enable: false
VLLM:
  enable: false
prompt: ""
prompt_template: buddy-neutral-prompt.txt

selected_module:
  LLM: BuddyCoreLLM
  Memory: nomem
  Intent: nointent
  ASR: BuddyQwenASR
  TTS: BuddyQwenTTS
  VLLM: null

LLM:
  BuddyCoreLLM:
    type: buddy_core
    base_url: http://127.0.0.1:8010
    timeout_seconds: 30

Memory:
  nomem:
    type: nomem

Intent:
  nointent:
    type: nointent

ASR:
  BuddyQwenASR:
    type: buddy_qwen
    provider_name: ${ASR_PROVIDER}
    api_key: ${ASR_API_KEY}
    model_name: ${ASR_MODEL}
    base_url: ${ASR_HTTP_URL}
    timeout_seconds: ${ASR_TIMEOUT_SECONDS}

TTS:
  BuddyQwenTTS:
    type: buddy_qwen_http
    api_key: ${TTS_API_KEY}
    api_url: ${TTS_HTTP_URL}
    model: ${TTS_MODEL}
    voice: ${TTS_VOICE}
    language: ${TTS_LANGUAGE}
    timeout_seconds: ${TTS_TIMEOUT_SECONDS}
