[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-buddy-brain"
version = "0.1.0"
description = "Local Buddy Core service for XiaoZhi-compatible English companion education demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.28.1,<1",
  "opuslib_next>=1.1.5,<2",
  "openai>=2.8.1,<3",
  "websockets==14.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_provider: makes a real configured ASR provider request",
]

[tool.hatch.build.targets.wheel]
packages = ["buddy_brain"]
