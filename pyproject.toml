[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-buddy-brain"
version = "0.1.0"
description = "Local Buddy Core service for XiaoZhi-compatible English companion education demo"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "opuslib_next>=1.1.5,<2",
  "openai>=1.40,<2",
  "numpy>=1.26,<3",
  "onnxruntime>=1.16,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["buddy_brain", "buddy_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"buddy_gateway/assets/silero_vad.onnx" = "buddy_gateway/assets/silero_vad.onnx"
"THIRD_PARTY_NOTICES.md" = "ai_buddy_brain-0.1.0.dist-info/THIRD_PARTY_NOTICES.md"
"licenses/xiaozhi-esp32-server-MIT.txt" = "ai_buddy_brain-0.1.0.dist-info/licenses/xiaozhi-esp32-server-MIT.txt"
"licenses/silero-vad-MIT.txt" = "ai_buddy_brain-0.1.0.dist-info/licenses/silero-vad-MIT.txt"
